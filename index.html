<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a09" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Trails</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f4efe6;
      --dim: #8a8378;
      --gold: #e4b84d;
      --glass: rgba(12, 11, 10, 0.72);
      --line: rgba(255, 255, 255, 0.08);
      --paper: #1c1915;
      --text: #efe8dc;
      --bar: #0b0a09;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bar);
      color: var(--ink);
      overflow: hidden;
    }
    .app { height: 100%; display: flex; flex-direction: column; }
    .head {
      flex: none;
      padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
    }
    .app.read .head { background: var(--paper); border-color: #2a2621; }
    .app.read .kicker, .app.read .host, .app.read .count { color: #a39888; }
    .app.read .title, .app.read .brand { color: var(--text); }
    .rail { height: 2px; background: #2a2622; border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
    .rail > i { display: block; height: 100%; width: 0; background: var(--ink); transition: width 200ms ease; }
    .kicker { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .brand { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 500; }
    .count { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .title {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 560;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .host { margin-top: 2px; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stage { flex: 1; position: relative; min-height: 0; background: #fff; }
    iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0; background: #fff;
    }
    .app.read iframe { visibility: hidden; pointer-events: none; }
    .reader {
      display: none;
      position: absolute; inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--paper);
      color: var(--text);
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }
    .app.read .reader { display: block; }
    .paper {
      max-width: 36rem;
      width: 100%;
      margin: 0 auto;
      padding: 28px 22px calc(110px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }
    .md {
      font-family: "Newsreader", "Iowan Old Style", Palatino, Georgia, serif;
      font-size: 19px;
      font-optical-sizing: auto;
      line-height: 1.65;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .md h1, .md h2, .md h3 { font-weight: 560; letter-spacing: -0.02em; line-height: 1.28; }
    .md h1 { font-size: 1.5em; margin: 1.1em 0 0.35em; }
    .md h1:first-child { margin-top: 0; }
    .md h2 { font-size: 1.22em; margin: 1.35em 0 0.35em; }
    .md h3 { font-size: 1.08em; margin: 1.2em 0 0.3em; }
    .md p { margin: 0.85em 0; }
    .md a { color: #d4b56a; }
    .md ul, .md ol { padding-left: 1.2em; }
    .md li { margin: 0.25em 0; }
    .md blockquote {
      margin: 1em 0; padding: 0 0 0 1em;
      border-left: 2px solid #3d3830; color: #cfc6b6;
    }
    .md img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.1em auto;
      border-radius: 8px;
      background: #2a2621;
    }
    .md img.bad { display: none; }
    .md table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
    .md td, .md th { border-bottom: 1px solid #2a2621; padding: 6px 8px; text-align: left; }
    .md pre, .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82em; }
    .md pre { white-space: pre-wrap; overflow-x: hidden; background: #2a2621; padding: 12px; border-radius: 8px; }
    .wait, .fail { color: #a39888; padding: 12px 0; }
    .dock {
      position: absolute;
      left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 2px;
      padding: 6px;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      z-index: 4;
    }
    .dock button {
      appearance: none; border: 0; background: transparent;
      color: var(--ink); width: 44px; height: 44px;
      border-radius: 999px; display: grid; place-items: center; cursor: pointer;
    }
    .dock button:hover { background: rgba(255,255,255,0.08); }
    .dock svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .dock .star.on { color: var(--gold); }
    .dock .star.on svg { fill: currentColor; }
    .dock .aa.on { color: var(--gold); }
    .sheet {
      position: absolute;
      left: 50%;
      bottom: calc(80px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(8px);
      width: min(280px, calc(100vw - 32px));
      padding: 8px;
      background: var(--glass);
      backdrop-filter: blur(22px);
      border: 1px solid var(--line);
      border-radius: 16px;
      opacity: 0; visibility: hidden;
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms;
      z-index: 5;
    }
    .app.menu .sheet { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .sheet button, .sheet a {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 12px; border: 0; background: transparent;
      color: var(--ink); font: inherit; font-size: 14px;
      text-decoration: none; cursor: pointer; border-radius: 10px;
    }
    .sheet button:hover, .sheet a:hover { background: rgba(255,255,255,0.07); }
    .sheet .hint { color: var(--dim); font-size: 12px; }
    .empty {
      display: none; position: absolute; inset: 0;
      background: var(--bar);
      align-items: center; justify-content: center;
      text-align: center; padding: 40px; color: var(--dim);
    }
    .empty.on { display: flex; }
    .empty strong { display: block; color: var(--ink); font-weight: 520; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="head">
      <div class="rail"><i id="fill"></i></div>
      <div class="kicker"><span class="brand" id="brand">Trails</span><span class="count" id="count"></span></div>
      <div class="title" id="title"></div>
      <div class="host" id="host"></div>
    </header>
    <div class="stage">
      <iframe id="frame" title="article" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="reader" id="reader"><div class="paper"><div class="md" id="rbody"></div></div></div>
      <div class="empty" id="empty"><div><strong>Nothing saved</strong>Star a piece. It stays on this browser.</div></div>
      <div class="sheet">
        <a id="open" target="_blank" rel="noopener">Open original <span class="hint">↗</span></a>
        <button type="button" id="shuffle">Shuffle <span class="hint">S</span></button>
        <button type="button" id="mode">Saved only <span class="hint" id="modehint">Off</span></button>
      </div>
      <div class="dock">
        <button type="button" id="prev" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button type="button" class="star" id="star" aria-label="Favorite"><svg viewBox="0 0 24 24"><path d="M12 3.6l2.4 5 5.5.8-4 3.9.9 5.5L12 16.6 7.2 18.8l.9-5.5-4-3.9 5.5-.8z"/></svg></button>
        <button type="button" class="aa" id="aa" aria-label="Reader mode"><svg viewBox="0 0 24 24"><path d="M4 20l5-16h2l5 16"/><path d="M6.2 14h7.6"/></svg></button>
        <button type="button" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button type="button" id="more" aria-label="More"><svg viewBox="0 0 24 24"><path d="M6 12h.01M12 12h.01M18 12h.01"/></svg></button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script>
    const KEY = "trails-favs-v1";
    const MODE = "trails-view";
    const NO_FRAME = new Set([
      "a16z.com",
      "anthropic.com",
      "benjaminrosshoffman.com",
      "bloomberg.com",
      "commoncog.com",
      "darioamodei.com",
      "dwarkesh.com",
      "experimental-history.com",
      "fantasticanachronism.com",
      "henrikkarlsson.xyz",
      "interconnects.ai",
      "johndcook.com",
      "maximum-progress.com",
      "medium.com",
      "netinterest.co",
      "nytimes.com",
      "owlposting.com",
      "press.stripe.com",
      "publicdomainreview.org",
      "qntm.org",
      "rameznaam.com",
      "sites.google.com",
      "statecraft.pub",
      "theintrinsicperspective.com",
      "thepsmiths.com",
      "usenix.org",
      "venture.angellist.com",
      "vgel.me",
      "vitalik.eth.limo",
      "yegge.ai"
    ]);
    let all = [], deck = [], i = 0, savedOnly = false, favs = new Set();
    let readerOn = false;
    let shownReader = "";
    const cache = new Map();
    const $ = (id) => document.getElementById(id);
    const app = $("app");
    const frame = $("frame");

    if (window.marked) {
      marked.setOptions({ gfm: true, breaks: false });
    }

    function loadFavs() {
      try { favs = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); }
      catch (_) { favs = new Set(); }
      readerOn = sessionStorage.getItem(MODE) === "reader";
    }
    function saveFavs() { localStorage.setItem(KEY, JSON.stringify([...favs])); }
    function shuffle(a) {
      const b = a.slice();
      for (let n = b.length - 1; n > 0; n--) {
        const j = Math.floor(Math.random() * (n + 1));
        [b[n], b[j]] = [b[j], b[n]];
      }
      return b;
    }
    function current() { return deck[i]; }
    function hostKey(it) {
      try { return new URL(it.url).hostname.replace(/^www\./, ""); }
      catch (_) { return String(it.host || "").replace(/^www\./, ""); }
    }
    function blocksFrame(it) {
      if (!it) return false;
      const h = hostKey(it);
      return NO_FRAME.has(h) || h === "substack.com" || h.endsWith(".substack.com");
    }

    function cleanSource(src) {
      let t = src.replace(/\r\n/g, "\n");
      t = t.replace(/^Title:.*\n/m, "");
      t = t.replace(/^URL Source:.*\n/m, "");
      t = t.replace(/^Published Time:.*\n/m, "");
      t = t.replace(/^Markdown Content:\s*\n/m, "");
      t = t.replace(/^Warning:.*\n/gm, "");
      t = t.replace(/^#{0,3} ?Skip to (content|navigation).*\n/gim, "");
      return t.trim();
    }

    function renderMd(src) {
      const t = cleanSource(src);
      let html = window.marked ? marked.parse(t) : t;
      html = window.DOMPurify ? DOMPurify.sanitize(html, { USE_PROFILES: { html: true } }) : html;
      return html;
    }

    function finishImages(root) {
      root.querySelectorAll("img").forEach((img) => {
        img.loading = "lazy";
        img.decoding = "async";
        img.removeAttribute("width");
        img.removeAttribute("height");
        img.onerror = () => img.classList.add("bad");
        img.onload = () => {
          if (img.naturalWidth < 4 || img.naturalHeight < 4) img.classList.add("bad");
        };
      });
    }

    async function pull(url) {
      const hit = cache.get(url);
      if (hit) return hit;
      const job = fetch("https://r.jina.ai/" + url).then((r) => {
        if (!r.ok) throw new Error("bad");
        return r.text();
      }).then((t) => { cache.set(url, t); return t; }).catch((e) => { cache.delete(url); throw e; });
      cache.set(url, job);
      return job;
    }

    function prefetchAround() {
      [1, -1].forEach((d) => {
        const it = deck[(i + d + deck.length) % deck.length];
        if (it) pull(it.url).catch(() => {});
      });
    }

    async function fillReader(it) {
      const box = $("rbody");
      if (!it) { box.innerHTML = ""; shownReader = ""; return; }
      if (shownReader === it.url && box.childNodes.length) return;
      const cached = cache.get(it.url);
      if (typeof cached === "string") {
        box.innerHTML = renderMd(cached);
        finishImages(box);
        $("reader").scrollTop = 0;
        shownReader = it.url;
        return;
      }
      box.innerHTML = "<p class='wait'>Pulling a clean copy…</p>";
      shownReader = "";
      try {
        const t = await pull(it.url);
        if (current() && current().url === it.url) {
          box.innerHTML = renderMd(t);
          finishImages(box);
          $("reader").scrollTop = 0;
          shownReader = it.url;
        }
      } catch (_) {
        if (current() && current().url === it.url) {
          box.innerHTML = blocksFrame(it)
            ? "<p class='fail'>Couldn’t pull a reader copy. Open original instead.</p>"
            : "<p class='fail'>Couldn’t pull a reader copy. Tap Aa to go back to the site.</p>";
        }
      }
    }

    function setSite(it) {
      if (!it) { frame.src = "about:blank"; frame.dataset.url = ""; return; }
      if (frame.dataset.url !== it.url) {
        frame.src = it.url;
        frame.dataset.url = it.url;
      }
    }

    function show() {
      const it = current();
      $("empty").classList.toggle("on", !it);
      $("modehint").textContent = savedOnly ? "On" : "Off";
      $("brand").textContent = savedOnly ? "Saved" : "Trails";
      const forced = blocksFrame(it);
      const reading = readerOn || forced;
      app.classList.toggle("read", reading);
      $("aa").classList.toggle("on", reading);
      sessionStorage.setItem(MODE, readerOn ? "reader" : "site");
      if (!it) {
        $("title").textContent = "Saved";
        $("host").textContent = "";
        $("count").textContent = "";
        $("star").classList.remove("on");
        setSite(null);
        $("rbody").innerHTML = "";
        shownReader = "";
        $("fill").style.width = "0";
        return;
      }
      $("title").textContent = it.title;
      $("host").textContent = forced ? it.host + " · won’t embed" : it.host;
      $("count").textContent = (i + 1) + " / " + deck.length;
      $("open").href = it.url;
      $("star").classList.toggle("on", favs.has(it.url));
      $("fill").style.width = ((i + 1) / deck.length * 100) + "%";
      if (reading) {
        if (!forced) setSite(it);
        else if (frame.dataset.url) { frame.src = "about:blank"; frame.dataset.url = ""; }
        fillReader(it);
        prefetchAround();
      } else {
        setSite(it);
        prefetchAround();
      }
    }

    function rebuild(keepUrl) {
      const src = savedOnly ? all.filter((x) => favs.has(x.url)) : all;
      const here = keepUrl || (current() && current().url);
      deck = src.slice();
      i = Math.max(0, deck.findIndex((x) => x.url === here));
      if (i < 0) i = 0;
      show();
    }
    function go(d) {
      if (!deck.length) return;
      i = (i + d + deck.length) % deck.length;
      show();
    }
    function toggleFav() {
      const it = current();
      if (!it) return;
      if (favs.has(it.url)) favs.delete(it.url);
      else favs.add(it.url);
      saveFavs();
      if (savedOnly) rebuild(it.url);
      else $("star").classList.toggle("on", favs.has(it.url));
    }
    function toggleReader() {
      readerOn = !readerOn;
      show();
    }

    $("prev").onclick = () => go(-1);
    $("next").onclick = () => go(1);
    $("star").onclick = toggleFav;
    $("aa").onclick = toggleReader;
    $("more").onclick = () => app.classList.toggle("menu");
    $("shuffle").onclick = () => { deck = shuffle(deck); i = 0; app.classList.remove("menu"); show(); };
    $("mode").onclick = () => { savedOnly = !savedOnly; app.classList.remove("menu"); rebuild(); };
    $("open").onclick = () => app.classList.remove("menu");

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") go(1);
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "s") { deck = shuffle(deck); i = 0; show(); }
      if (e.key === "f") toggleFav();
      if (e.key === "r") toggleReader();
      if (e.key === "Escape") app.classList.remove("menu");
    });
    document.addEventListener("pointerdown", (e) => {
      if (!e.target.closest(".dock") && !e.target.closest(".sheet")) app.classList.remove("menu");
    });

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

    loadFavs();
    fetch("articles.json")
      .then((r) => r.json())
      .then((data) => { all = data; deck = shuffle(data); show(); });
  </script>
</body>
</html>
