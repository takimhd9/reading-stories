<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Trails</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0b0a;
      --fg: #f4efe6;
      --muted: #9a9388;
      --line: #2a2723;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
    }
    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .bar {
      flex: none;
      padding: 10px 12px calc(10px + env(safe-area-inset-top));
      padding-top: calc(10px + env(safe-area-inset-top));
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .progress {
      height: 3px;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress > i { display: block; height: 100%; background: var(--fg); width: 0; }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .count { color: var(--muted); font-size: 12px; flex: none; }
    button, a.btn {
      appearance: none;
      border: 0;
      background: #1a1815;
      color: var(--fg);
      border-radius: 999px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      flex: none;
    }
    a.btn { background: var(--fg); color: var(--bg); font-weight: 600; }
    .stage {
      flex: 1;
      position: relative;
      min-height: 0;
      background: #fff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    .block {
      display: none;
      position: absolute;
      inset: 0;
      background: var(--bg);
      color: var(--fg);
      padding: 48px 24px;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .block.on { display: flex; flex-direction: column; gap: 16px; }
    .block p { color: var(--muted); margin: 0; max-width: 28em; }
  </style>
</head>
<body>
  <div class="app">
    <div class="bar">
      <div class="progress"><i id="fill"></i></div>
      <div class="row">
        <button type="button" id="prev">Back</button>
        <button type="button" id="next">Next</button>
        <button type="button" id="shuffle">Shuffle</button>
        <div class="title" id="title"></div>
        <div class="count" id="count"></div>
        <a class="btn" id="open" target="_blank" rel="noopener">Open</a>
      </div>
    </div>
    <div class="stage">
      <iframe id="frame" title="article" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="block" id="block">
        <p id="blockmsg">This site won’t load in the frame.</p>
        <a class="btn" id="blockopen" target="_blank" rel="noopener">Open it</a>
      </div>
    </div>
  </div>
  <script>
    let items = [];
    let i = 0;
    let loadTok = 0;
    const $ = (id) => document.getElementById(id);

    function shuffle(a) {
      const b = a.slice();
      for (let n = b.length - 1; n > 0; n--) {
        const j = Math.floor(Math.random() * (n + 1));
        [b[n], b[j]] = [b[j], b[n]];
      }
      return b;
    }

    function show() {
      const it = items[i];
      if (!it) return;
      $("title").textContent = it.title;
      $("count").textContent = (i + 1) + " / " + items.length;
      $("fill").style.width = ((i + 1) / items.length * 100) + "%";
      $("open").href = it.url;
      $("blockopen").href = it.url;
      $("block").classList.remove("on");
      const tok = ++loadTok;
      const frame = $("frame");
      frame.src = "about:blank";
      requestAnimationFrame(() => {
        if (tok !== loadTok) return;
        frame.src = it.url;
      });
      setTimeout(() => {
        if (tok !== loadTok) return;
        try {
          const href = frame.contentWindow.location.href;
          if (href === "about:blank") {
            $("blockmsg").textContent = "This one blocked the embed.";
            $("block").classList.add("on");
          }
        } catch (_) {}
      }, 2800);
    }

    function go(d) {
      i = (i + d + items.length) % items.length;
      show();
    }

    $("prev").onclick = () => go(-1);
    $("next").onclick = () => go(1);
    $("shuffle").onclick = () => { items = shuffle(items); i = 0; show(); };

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") go(1);
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "s") $("shuffle").click();
    });

    fetch("articles.json")
      .then((r) => r.json())
      .then((data) => { items = shuffle(data); show(); });
  </script>
</body>
</html>
