<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a09" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Trails</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4efe6;
      --dim: #8a8378;
      --gold: #e4b84d;
      --glass: rgba(12, 11, 10, 0.72);
      --line: rgba(255, 255, 255, 0.08);
      --paper: #1c1915;
      --text: #efe8dc;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0b0a09;
      color: var(--ink);
      overflow: hidden;
    }
    .app { height: 100%; position: relative; }
    iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0; background: #fff;
    }
    .reader {
      display: none;
      position: absolute; inset: 0;
      z-index: 2;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--paper);
      color: var(--text);
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }
    .app.read .reader { display: block; }
    .paper {
      max-width: 34rem;
      width: 100%;
      margin: 0 auto;
      padding: calc(88px + env(safe-area-inset-top)) 22px calc(120px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }
    .paper .md {
      font-family: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: 20px;
      font-optical-sizing: auto;
      line-height: 1.65;
      letter-spacing: 0.005em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .paper .md h1, .paper .md h2, .paper .md h3 {
      font-weight: 550;
      letter-spacing: -0.02em;
      line-height: 1.28;
    }
    .paper .md h1 { font-size: 1.55em; margin: 1.2em 0 0.4em; }
    .paper .md h2 { font-size: 1.25em; margin: 1.4em 0 0.4em; }
    .paper .md p { margin: 0.9em 0; }
    .paper .md a { color: #d4b56a; }
    .paper .md img, .paper .md video, .paper .md iframe, .paper .md table {
      max-width: 100%; height: auto;
    }
    .paper .md pre, .paper .md code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82em;
    }
    .paper .md pre {
      white-space: pre-wrap;
      overflow-x: hidden;
      background: #2a2621;
      padding: 12px;
      border-radius: 8px;
    }
    .wait, .fail { color: #a39888; padding: 24px 0; font-family: "Newsreader", Georgia, serif; }
    .rail {
      position: absolute; left: 0; right: 0; top: 0; height: 2px;
      background: rgba(255,255,255,0.08); z-index: 4;
    }
    .rail > i { display: block; height: 100%; width: 0; background: var(--ink); transition: width 240ms ease; }
    .chrome { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
    .top {
      pointer-events: auto;
      padding: calc(16px + env(safe-area-inset-top)) 22px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.62), rgba(0,0,0,0));
    }
    .app.read .top { background: linear-gradient(to bottom, rgba(28,25,21,0.94), rgba(28,25,21,0)); }
    .app.read .kicker, .app.read .host { color: rgba(239,232,220,0.55); }
    .app.read .kicker b, .app.read h1 { color: var(--text); text-shadow: none; }
    .kicker {
      display: flex; align-items: baseline; gap: 10px;
      font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(244,239,230,0.7);
    }
    .kicker b { font-weight: 500; color: var(--ink); letter-spacing: 0.12em; }
    h1 {
      margin: 8px 0 0;
      font-size: clamp(18px, 2.4vw, 26px);
      font-weight: 520;
      letter-spacing: -0.03em;
      line-height: 1.2;
      max-width: 36rem;
      text-shadow: 0 1px 12px rgba(0,0,0,0.45);
    }
    .host { margin-top: 6px; font-size: 13px; color: rgba(244,239,230,0.62); }
    .dock {
      pointer-events: auto;
      position: absolute;
      left: 50%; bottom: calc(22px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 2px;
      padding: 6px;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .dock button {
      appearance: none; border: 0; background: transparent;
      color: var(--ink);
      width: 44px; height: 44px;
      border-radius: 999px;
      display: grid; place-items: center;
      cursor: pointer;
    }
    .dock button:hover { background: rgba(255,255,255,0.08); }
    .dock button:active { transform: scale(0.96); }
    .dock svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .dock .star.on { color: var(--gold); }
    .dock .star.on svg { fill: currentColor; }
    .dock .aa.on { color: var(--gold); }
    .sheet {
      pointer-events: auto;
      position: absolute;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(8px);
      width: min(280px, calc(100vw - 32px));
      padding: 8px;
      background: var(--glass);
      backdrop-filter: blur(22px);
      border: 1px solid var(--line);
      border-radius: 16px;
      opacity: 0; visibility: hidden;
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms;
    }
    .app.menu .sheet { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .sheet button, .sheet a {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 12px;
      border: 0; background: transparent;
      color: var(--ink); font: inherit; font-size: 14px;
      text-decoration: none; cursor: pointer; border-radius: 10px;
    }
    .sheet button:hover, .sheet a:hover { background: rgba(255,255,255,0.07); }
    .sheet .hint { color: var(--dim); font-size: 12px; }
    .empty {
      display: none; position: absolute; inset: 0;
      background: #0b0a09; z-index: 2;
      align-items: center; justify-content: center;
      text-align: center; padding: 40px; color: var(--dim);
    }
    .empty.on { display: flex; }
    .empty strong { display: block; color: var(--ink); font-weight: 520; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <iframe id="frame" title="article" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div class="reader" id="reader"><div class="paper"><div class="md" id="rbody"></div></div></div>
    <div class="rail"><i id="fill"></i></div>
    <div class="chrome">
      <div class="top">
        <div class="kicker"><b id="brand">Trails</b><span id="count"></span></div>
        <h1 id="title"></h1>
        <div class="host" id="host"></div>
      </div>
      <div class="sheet" id="sheet">
        <a id="open" target="_blank" rel="noopener">Open original <span class="hint">↗</span></a>
        <button type="button" id="shuffle">Shuffle <span class="hint">S</span></button>
        <button type="button" id="mode">Saved only <span class="hint" id="modehint">Off</span></button>
      </div>
      <div class="dock">
        <button type="button" id="prev" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button type="button" class="star" id="star" aria-label="Favorite"><svg viewBox="0 0 24 24"><path d="M12 3.6l2.4 5 5.5.8-4 3.9.9 5.5L12 16.6 7.2 18.8l.9-5.5-4-3.9 5.5-.8z"/></svg></button>
        <button type="button" class="aa" id="aa" aria-label="Reader mode"><svg viewBox="0 0 24 24"><path d="M4 20l5-16h2l5 16"/><path d="M6.2 14h7.6"/></svg></button>
        <button type="button" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button type="button" id="more" aria-label="More"><svg viewBox="0 0 24 24"><path d="M6 12h.01M12 12h.01M18 12h.01"/></svg></button>
      </div>
    </div>
    <div class="empty" id="empty"><div><strong>Nothing saved</strong>Star a piece. It stays on this browser.</div></div>
  </div>
  <script>
    const KEY = "trails-favs-v1";
    const MODE = "trails-view";
    let all = [], deck = [], i = 0, savedOnly = false, favs = new Set();
    let readerOn = false;
    const cache = new Map();
    const $ = (id) => document.getElementById(id);
    const app = $("app");
    const frame = $("frame");

    function loadFavs() {
      try { favs = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); }
      catch (_) { favs = new Set(); }
      readerOn = sessionStorage.getItem(MODE) === "reader";
    }
    function saveFavs() { localStorage.setItem(KEY, JSON.stringify([...favs])); }

    function shuffle(a) {
      const b = a.slice();
      for (let n = b.length - 1; n > 0; n--) {
        const j = Math.floor(Math.random() * (n + 1));
        [b[n], b[j]] = [b[j], b[n]];
      }
      return b;
    }
    function current() { return deck[i]; }

    function esc(s) {
      return s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    }
    function md(src) {
      let t = src.replace(/\r\n/g, "\n");
      t = t.replace(/^Title:.*\n/m, "");
      t = t.replace(/^URL Source:.*\n/m, "");
      t = t.replace(/^Markdown Content:\s*\n/m, "");
      t = t.replace(/^Warning:.*\n/gm, "");
      const parts = t.split(/```/);
      let html = "";
      parts.forEach((chunk, n) => {
        if (n % 2 === 1) {
          const nl = chunk.indexOf("\n");
          html += "<pre><code>" + esc(nl === -1 ? chunk : chunk.slice(nl + 1)) + "</code></pre>";
          return;
        }
        let c = esc(chunk);
        c = c.replace(/^### (.+)$/gm, "<h3>$1</h3>");
        c = c.replace(/^## (.+)$/gm, "<h2>$1</h2>");
        c = c.replace(/^# (.+)$/gm, "<h1>$1</h1>");
        c = c.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        c = c.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        c = c.replace(/(^|\n)[\-\*] (.+)/g, "$1<li>$2</li>");
        c = c.replace(/(<li>.*<\/li>\n?)+/g, (m) => "<ul>" + m + "</ul>");
        html += c.split(/\n{2,}/).map((p) => /^<(h\d|ul|pre|li)/.test(p.trim()) ? p : "<p>" + p.replace(/\n/g, "<br>") + "</p>").join("");
      });
      return html;
    }

    async function pull(url) {
      if (cache.has(url)) return cache.get(url);
      const job = fetch("https://r.jina.ai/" + url).then((r) => {
        if (!r.ok) throw new Error("bad");
        return r.text();
      }).then((t) => { cache.set(url, t); return t; }).catch((e) => { cache.delete(url); throw e; });
      cache.set(url, job);
      return job;
    }

    function prefetchAround() {
      [-1, 1, 2].forEach((d) => {
        const it = deck[i + d] || deck[(i + d + deck.length) % deck.length];
        if (it) pull(it.url).catch(() => {});
      });
    }

    async function fillReader(it) {
      const box = $("rbody");
      if (!it) { box.innerHTML = ""; return; }
      if (cache.has(it.url) && typeof cache.get(it.url) === "string") {
        box.innerHTML = md(cache.get(it.url));
        $("reader").scrollTop = 0;
        return;
      }
      box.innerHTML = "<p class='wait'>Pulling a clean copy…</p>";
      try {
        const t = await pull(it.url);
        if (current() && current().url === it.url) {
          box.innerHTML = md(t);
          $("reader").scrollTop = 0;
        }
      } catch (_) {
        if (current() && current().url === it.url) {
          box.innerHTML = "<p class='fail'>Couldn’t pull a reader copy. The live site is still underneath. Tap Aa to go back.</p>";
        }
      }
    }

    function setSite(it) {
      if (!it) { frame.src = "about:blank"; frame.dataset.url = ""; return; }
      if (frame.dataset.url !== it.url) {
        frame.src = it.url;
        frame.dataset.url = it.url;
      }
    }

    function show() {
      const it = current();
      $("empty").classList.toggle("on", !it);
      $("modehint").textContent = savedOnly ? "On" : "Off";
      $("brand").textContent = savedOnly ? "Saved" : "Trails";
      app.classList.toggle("read", readerOn);
      $("aa").classList.toggle("on", readerOn);
      sessionStorage.setItem(MODE, readerOn ? "reader" : "site");
      if (!it) {
        $("title").textContent = "Saved";
        $("host").textContent = "";
        $("count").textContent = "";
        $("star").classList.remove("on");
        setSite(null);
        $("rbody").innerHTML = "";
        $("fill").style.width = "0";
        return;
      }
      $("title").textContent = it.title;
      $("host").textContent = it.host;
      $("count").textContent = String(i + 1).padStart(3, "0") + "  /  " + String(deck.length).padStart(3, "0");
      $("open").href = it.url;
      $("star").classList.toggle("on", favs.has(it.url));
      $("fill").style.width = ((i + 1) / deck.length * 100) + "%";
      setSite(it);
      if (readerOn) fillReader(it);
      prefetchAround();
    }

    function rebuild(keepUrl) {
      const src = savedOnly ? all.filter((x) => favs.has(x.url)) : all;
      const here = keepUrl || (current() && current().url);
      deck = src.slice();
      i = Math.max(0, deck.findIndex((x) => x.url === here));
      if (i < 0) i = 0;
      show();
    }
    function go(d) {
      if (!deck.length) return;
      i = (i + d + deck.length) % deck.length;
      show();
    }
    function toggleFav() {
      const it = current();
      if (!it) return;
      if (favs.has(it.url)) favs.delete(it.url);
      else favs.add(it.url);
      saveFavs();
      if (savedOnly) rebuild(it.url);
      else $("star").classList.toggle("on", favs.has(it.url));
    }
    function toggleReader() {
      readerOn = !readerOn;
      show();
    }

    $("prev").onclick = () => go(-1);
    $("next").onclick = () => go(1);
    $("star").onclick = toggleFav;
    $("aa").onclick = toggleReader;
    $("more").onclick = () => app.classList.toggle("menu");
    $("shuffle").onclick = () => { deck = shuffle(deck); i = 0; app.classList.remove("menu"); show(); };
    $("mode").onclick = () => { savedOnly = !savedOnly; app.classList.remove("menu"); rebuild(); };
    $("open").onclick = () => app.classList.remove("menu");

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") go(1);
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "s") { deck = shuffle(deck); i = 0; show(); }
      if (e.key === "f") toggleFav();
      if (e.key === "r") toggleReader();
      if (e.key === "Escape") app.classList.remove("menu");
    });
    document.addEventListener("pointerdown", (e) => {
      if (!e.target.closest(".dock") && !e.target.closest(".sheet")) app.classList.remove("menu");
    });


    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

    loadFavs();
    fetch("articles.json")
      .then((r) => r.json())
      .then((data) => { all = data; deck = shuffle(data); show(); });
  </script>
</body>
</html>
