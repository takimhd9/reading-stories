<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a09" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Trails</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f4efe6;
      --dim: #8a8378;
      --gold: #e4b84d;
      --glass: rgba(12, 11, 10, 0.72);
      --line: rgba(255, 255, 255, 0.08);
      --paper: #1c1915;
      --text: #efe8dc;
      --bar: #0b0a09;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bar);
      color: var(--ink);
      overflow: hidden;
    }
    .app { height: 100%; display: flex; flex-direction: column; }
    .head {
      flex: none;
      padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
    }
    .app.read .head { background: var(--paper); border-color: #2a2621; }
    .app.read .kicker, .app.read .host, .app.read .count { color: #a39888; }
    .app.read .title, .app.read .brand { color: var(--text); }
    .rail { height: 2px; background: #2a2622; border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
    .rail > i { display: block; height: 100%; width: 0; background: var(--ink); transition: width 200ms ease; }
    .kicker { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .brand { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 500; }
    .count { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .title {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 560;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .host { margin-top: 2px; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stage { flex: 1; position: relative; min-height: 0; background: #fff; }
    iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0; background: #fff;
    }
    .app.read iframe { visibility: hidden; pointer-events: none; }
    .reader {
      display: none;
      position: absolute; inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--paper);
      color: var(--text);
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }
    .app.read .reader { display: block; }
    .paper {
      max-width: 36rem;
      width: 100%;
      margin: 0 auto;
      padding: 28px 22px calc(110px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }
    .md {
      font-family: "Newsreader", "Iowan Old Style", Palatino, Georgia, serif;
      font-size: 19px;
      font-optical-sizing: auto;
      line-height: 1.65;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .md h1, .md h2, .md h3 { font-weight: 560; letter-spacing: -0.02em; line-height: 1.28; }
    .md h1 { font-size: 1.5em; margin: 1.1em 0 0.35em; }
    .md h1:first-child { margin-top: 0; }
    .md h2 { font-size: 1.22em; margin: 1.35em 0 0.35em; }
    .md h3 { font-size: 1.08em; margin: 1.2em 0 0.3em; }
    .md p { margin: 0.85em 0; }
    .md a { color: #d4b56a; }
    .md ul, .md ol { padding-left: 1.2em; }
    .md li { margin: 0.25em 0; }
    .md blockquote {
      margin: 1em 0; padding: 0 0 0 1em;
      border-left: 2px solid #3d3830; color: #cfc6b6;
    }
    .md img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.1em auto;
      border-radius: 8px;
      background: #2a2621;
    }
    .md img.bad { display: none; }
    .md table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
    .md td, .md th { border-bottom: 1px solid #2a2621; padding: 6px 8px; text-align: left; }
    .md pre, .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82em; }
    .md pre { white-space: pre-wrap; overflow-x: hidden; background: #2a2621; padding: 12px; border-radius: 8px; }
    .wait, .fail { color: #a39888; padding: 12px 0; }
    .dock {
      position: absolute;
      z-index: 8;
      left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 2px;
      padding: 6px;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .dock button {
      appearance: none; border: 0; background: transparent;
      color: var(--ink); width: 44px; height: 44px;
      border-radius: 999px; display: grid; place-items: center; cursor: pointer;
    }
    .dock button:hover { background: rgba(255,255,255,0.08); }
    .dock svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .dock .star.on { color: #e86b6b; }
    .dock .star.on svg { fill: currentColor; }
    .dock .aa.on { color: var(--gold); }
    .whysheet {
      position: absolute;
      left: 50%;
      bottom: calc(80px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(8px);
      width: min(320px, calc(100vw - 32px));
      padding: 14px;
      background: var(--glass);
      backdrop-filter: blur(22px);
      border: 1px solid var(--line);
      border-radius: 16px;
      opacity: 0; visibility: hidden;
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms;
      z-index: 6;
    }
    .app.why .whysheet { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .whyhead { font-size: 14px; font-weight: 520; margin-bottom: 8px; }
    .whysheet textarea {
      width: 100%; min-height: 72px; resize: none;
      border: 1px solid var(--line); border-radius: 10px;
      background: rgba(0,0,0,0.25); color: var(--ink);
      font: inherit; font-size: 14px; padding: 10px;
      outline: none;
    }
    .whyrow { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .whyrow button {
      appearance: none; border: 0; background: rgba(255,255,255,0.08);
      color: var(--ink); font: inherit; font-size: 13px;
      padding: 8px 12px; border-radius: 999px; cursor: pointer;
    }
    .whyrow #whysave { background: #e86b6b; color: #1a0f0f; font-weight: 560; }
    .sheet {
      position: absolute;
      left: 50%;
      bottom: calc(80px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(8px);
      width: min(280px, calc(100vw - 32px));
      padding: 8px;
      background: var(--glass);
      backdrop-filter: blur(22px);
      border: 1px solid var(--line);
      border-radius: 16px;
      opacity: 0; visibility: hidden;
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms;
      z-index: 5;
    }
    .app.menu .sheet { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .sheet button, .sheet a {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 12px; border: 0; background: transparent;
      color: var(--ink); font: inherit; font-size: 14px;
      text-decoration: none; cursor: pointer; border-radius: 10px;
    }
    .sheet button:hover, .sheet a:hover { background: rgba(255,255,255,0.07); }
    .sheet .hint { color: var(--dim); font-size: 12px; }
    .sheet button.on { background: rgba(255,255,255,0.07); }
    .sheet .sec { padding: 8px 12px 2px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
    .empty {
      display: none; position: absolute; inset: 0;
      background: var(--bar);
      align-items: center; justify-content: center;
      text-align: center; padding: 40px; color: var(--dim);
    }
    .empty.on { display: flex; }
    .empty strong { display: block; color: var(--ink); font-weight: 520; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="head">
      <div class="rail"><i id="fill"></i></div>
      <div class="kicker"><span class="brand" id="brand">Trails</span><span class="count" id="count"></span></div>
      <div class="title" id="title"></div>
      <div class="host" id="host"></div>
    </header>
    <div class="stage">
      <iframe id="frame" title="article" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="reader" id="reader"><div class="paper"><div class="md" id="rbody"></div></div></div>
      <div class="empty" id="empty"><div><strong>Nothing liked</strong>Heart a piece. Say why if you want. We use that to find more.</div></div>
      <div class="sheet">
        <a id="open" target="_blank" rel="noopener">Open original <span class="hint">↗</span></a>
        <button type="button" id="shuffle">Shuffle <span class="hint">S</span></button>
        <button type="button" id="mode">Liked only <span class="hint" id="modehint">Off</span></button>
        <div class="sec">Collections</div>
        <div id="cols"></div>
      </div>
      <div class="whysheet" id="whybox">
        <div class="whyhead">Liked. Why?</div>
        <textarea id="why" maxlength="400" placeholder="What landed for you"></textarea>
        <div class="whyrow">
          <button type="button" id="whyskip">Skip</button>
          <button type="button" id="whysave">Save</button>
        </div>
      </div>
      <div class="dock">
        <button type="button" id="prev" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button type="button" class="star" id="star" aria-label="Like"><svg viewBox="0 0 24 24"><path d="M12 20.4s-6.7-4.2-9.4-8.1C.6 9.7 1 5.8 3.9 4.1c2.3-1.4 5.1-.8 8.1 2 3-2.8 5.8-3.4 8.1-2 2.9 1.7 3.3 5.6 1.3 8.2-2.7 3.9-9.4 8.1-9.4 8.1z"/></svg></button>
        <button type="button" class="aa" id="aa" aria-label="Reader mode"><svg viewBox="0 0 24 24"><path d="M4 20l5-16h2l5 16"/><path d="M6.2 14h7.6"/></svg></button>
        <button type="button" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button type="button" id="more" aria-label="More"><svg viewBox="0 0 24 24"><path d="M6 12h.01M12 12h.01M18 12h.01"/></svg></button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script>
    const KEY = "trails-favs-v1";
    const MODE = "trails-view";
    const COLKEY = "trails-col-v1";
    const VER = "14";
    function bust(path) { return path + (path.includes("?") ? "&" : "?") + "v=" + VER; }
    const RID = "trails-reader-v1";
    const SB = "https://styuttskzaxquzqgswgx.supabase.co";
    const SBKEY = "sb_publishable_ZbAZMysSVE5SqaEjhX_viA_kKj4be_Y";
    const NO_FRAME = new Set([
      "a16z.com",
      "anthropic.com",
      "benjaminrosshoffman.com",
      "bloomberg.com",
      "commoncog.com",
      "darioamodei.com",
      "dwarkesh.com",
      "experimental-history.com",
      "fantasticanachronism.com",
      "henrikkarlsson.xyz",
      "interconnects.ai",
      "johndcook.com",
      "maximum-progress.com",
      "designobserver.com",
      "medium.com",
      "newyorker.com",
      "netinterest.co",
      "nytimes.com",
      "owlposting.com",
      "press.stripe.com",
      "publicdomainreview.org",
      "qntm.org",
      "rameznaam.com",
      "sites.google.com",
      "statecraft.pub",
      "theintrinsicperspective.com",
      "theverge.com",
      "thepsmiths.com",
      "usenix.org",
      "venture.angellist.com",
      "vgel.me",
      "vitalik.eth.limo",
      "yegge.ai"
    ]);
    let all = [], deck = [], i = 0, savedOnly = false, favs = new Set();
    let catalogs = [], col = null;
    let readerOn = false;
    let shownReader = "";
    const cache = new Map();
    const $ = (id) => document.getElementById(id);
    const app = $("app");
    const frame = $("frame");

    if (window.marked) {
      marked.setOptions({ gfm: true, breaks: false });
    }

    function loadFavs() {
      try { favs = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); }
      catch (_) { favs = new Set(); }
      readerOn = sessionStorage.getItem(MODE) === "reader";
    }
    function saveFavs() { localStorage.setItem(KEY, JSON.stringify([...favs])); }
    function readerId() {
      let id = localStorage.getItem(RID);
      if (!id || id.length < 8) {
        id = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + "-" + Math.random().toString(16).slice(2));
        localStorage.setItem(RID, id);
      }
      return id;
    }
    function colId() { return (col && col.id) || "taki"; }
    function sbHeaders() {
      return { apikey: SBKEY, Authorization: "Bearer " + SBKEY, "Content-Type": "application/json" };
    }
    function likeQuery(it) {
      return "collection=eq." + encodeURIComponent(colId()) +
        "&reader_id=eq." + encodeURIComponent(readerId()) +
        "&url=eq." + encodeURIComponent(it.url);
    }
    function pushLike(it, on, why) {
      if (!it || !it.url) return;
      const q = likeQuery(it);
      if (on) {
        const body = {
          collection: colId(), url: it.url, title: it.title || "", host: it.host || "",
          reader_id: readerId(), why: why || ""
        };
        fetch(SB + "/rest/v1/likes", {
          method: "POST",
          headers: Object.assign({ Prefer: "return=minimal,resolution=merge-duplicates" }, sbHeaders()),
          body: JSON.stringify(body)
        }).catch(function () {});
      } else {
        fetch(SB + "/rest/v1/likes?" + q, { method: "DELETE", headers: sbHeaders() }).catch(function () {});
      }
    }
    function saveWhy(it, why) {
      if (!it || !it.url) return;
      fetch(SB + "/rest/v1/likes?" + likeQuery(it), {
        method: "PATCH",
        headers: Object.assign({ Prefer: "return=minimal" }, sbHeaders()),
        body: JSON.stringify({ why: (why || "").trim() })
      }).catch(function () {});
    }
    function openWhy() {
      app.classList.remove("menu");
      $("why").value = "";
      app.classList.add("why");
      setTimeout(function () { $("why").focus(); }, 80);
    }
    function closeWhy() { app.classList.remove("why"); }
    function pullLikes() {
      fetch(SB + "/rest/v1/likes?select=url&reader_id=eq." + encodeURIComponent(readerId()), { headers: sbHeaders() })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (rows) {
          (rows || []).forEach(function (row) { if (row.url) favs.add(row.url); });
          saveFavs();
          const it = current();
          if (it) $("star").classList.toggle("on", favs.has(it.url));
        })
        .catch(function () {});
    }
    function shuffle(a) {
      const b = a.slice();
      for (let n = b.length - 1; n > 0; n--) {
        const j = Math.floor(Math.random() * (n + 1));
        [b[n], b[j]] = [b[j], b[n]];
      }
      return b;
    }
    function current() { return deck[i]; }
    function hostKey(it) {
      try { return new URL(it.url).hostname.replace(/^www\./, ""); }
      catch (_) { return String(it.host || "").replace(/^www\./, ""); }
    }
    function blocksFrame(it) {
      if (!it) return false;
      const h = hostKey(it);
      return NO_FRAME.has(h) || h === "substack.com" || h.endsWith(".substack.com");
    }

    function cleanSource(src) {
      let t = src.replace(/\r\n/g, "\n");
      t = t.replace(/^Title:.*\n/m, "");
      t = t.replace(/^URL Source:.*\n/m, "");
      t = t.replace(/^Published Time:.*\n/m, "");
      t = t.replace(/^Markdown Content:\s*\n/m, "");
      t = t.replace(/^Warning:.*\n/gm, "");
      t = t.replace(/^#{0,3} ?Skip to (content|navigation).*\n/gim, "");
      return t.trim();
    }

    function renderMd(src) {
      const t = cleanSource(src);
      let html = window.marked ? marked.parse(t) : t;
      html = window.DOMPurify ? DOMPurify.sanitize(html, { USE_PROFILES: { html: true } }) : html;
      return html;
    }

    function finishImages(root) {
      root.querySelectorAll("img").forEach((img) => {
        img.loading = "lazy";
        img.decoding = "async";
        img.removeAttribute("width");
        img.removeAttribute("height");
        img.onerror = () => img.classList.add("bad");
        img.onload = () => {
          if (img.naturalWidth < 4 || img.naturalHeight < 4) img.classList.add("bad");
        };
      });
    }

    async function pull(url) {
      const hit = cache.get(url);
      if (hit) return hit;
      const job = fetch("https://r.jina.ai/" + url).then((r) => {
        if (!r.ok) throw new Error("bad");
        return r.text();
      }).then((t) => { cache.set(url, t); return t; }).catch((e) => { cache.delete(url); throw e; });
      cache.set(url, job);
      return job;
    }

    function prefetchAround() {
      [1, -1].forEach((d) => {
        const it = deck[(i + d + deck.length) % deck.length];
        if (it) pull(it.url).catch(() => {});
      });
    }

    async function fillReader(it) {
      const box = $("rbody");
      if (!it) { box.innerHTML = ""; shownReader = ""; return; }
      if (shownReader === it.url && box.childNodes.length) return;
      const cached = cache.get(it.url);
      if (typeof cached === "string") {
        box.innerHTML = renderMd(cached);
        finishImages(box);
        $("reader").scrollTop = 0;
        shownReader = it.url;
        return;
      }
      box.innerHTML = "<p class='wait'>Pulling a clean copy…</p>";
      shownReader = "";
      try {
        const t = await pull(it.url);
        if (current() && current().url === it.url) {
          box.innerHTML = renderMd(t);
          finishImages(box);
          $("reader").scrollTop = 0;
          shownReader = it.url;
        }
      } catch (_) {
        if (current() && current().url === it.url) {
          box.innerHTML = blocksFrame(it)
            ? "<p class='fail'>Couldn’t pull a reader copy. Open original instead.</p>"
            : "<p class='fail'>Couldn’t pull a reader copy. Tap Aa to go back to the site.</p>";
        }
      }
    }

    function setSite(it) {
      if (!it) { frame.src = "about:blank"; frame.dataset.url = ""; return; }
      if (frame.dataset.url !== it.url) {
        frame.src = it.url;
        frame.dataset.url = it.url;
      }
    }

    function show() {
      const it = current();
      $("empty").classList.toggle("on", !it);
      $("modehint").textContent = savedOnly ? "On" : "Off";
      $("brand").textContent = savedOnly ? "Saved" : (col && col.name ? col.name : "Trails");
      const forced = blocksFrame(it);
      const reading = readerOn || forced;
      app.classList.toggle("read", reading);
      $("aa").classList.toggle("on", reading);
      sessionStorage.setItem(MODE, readerOn ? "reader" : "site");
      if (!it) {
        $("title").textContent = "Saved";
        $("host").textContent = "";
        $("count").textContent = "";
        $("star").classList.remove("on");
        setSite(null);
        $("rbody").innerHTML = "";
        shownReader = "";
        $("fill").style.width = "0";
        return;
      }
      $("title").textContent = it.title;
      $("host").textContent = forced ? it.host + " · won’t embed" : it.host;
      $("count").textContent = (i + 1) + " / " + deck.length;
      $("open").href = it.url;
      $("star").classList.toggle("on", favs.has(it.url));
      $("fill").style.width = ((i + 1) / deck.length * 100) + "%";
      if (reading) {
        if (!forced) setSite(it);
        else if (frame.dataset.url) { frame.src = "about:blank"; frame.dataset.url = ""; }
        fillReader(it);
        prefetchAround();
      } else {
        setSite(it);
        prefetchAround();
      }
    }

    function rebuild(keepUrl) {
      const src = savedOnly ? all.filter((x) => favs.has(x.url)) : all;
      const here = keepUrl || (current() && current().url);
      deck = src.slice();
      i = Math.max(0, deck.findIndex((x) => x.url === here));
      if (i < 0) i = 0;
      show();
    }
    function go(d) {
      if (!deck.length) return;
      closeWhy();
      i = (i + d + deck.length) % deck.length;
      show();
    }
    function toggleFav() {
      const it = current();
      if (!it) return;
      if (favs.has(it.url)) {
        favs.delete(it.url);
        saveFavs();
        pushLike(it, false);
        closeWhy();
      } else {
        favs.add(it.url);
        saveFavs();
        pushLike(it, true);
        openWhy();
      }
      if (savedOnly) rebuild(it.url);
      else $("star").classList.toggle("on", favs.has(it.url));
    }
    function toggleReader() {
      readerOn = !readerOn;
      show();
    }

    $("prev").onclick = () => go(-1);
    $("next").onclick = () => go(1);
    $("star").onclick = toggleFav;
    $("aa").onclick = toggleReader;
    $("more").onclick = () => app.classList.toggle("menu");
    $("shuffle").onclick = () => { closeWhy(); deck = shuffle(deck); i = 0; app.classList.remove("menu"); show(); };
    $("mode").onclick = () => { savedOnly = !savedOnly; app.classList.remove("menu"); rebuild(); };
    $("open").onclick = () => app.classList.remove("menu");
    $("whyskip").onclick = () => closeWhy();
    $("whysave").onclick = () => {
      const it = current();
      saveWhy(it, $("why").value);
      closeWhy();
    };
    $("why").addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("whysave").click();
      if (e.key === "Escape") closeWhy();
    });

    function isTyping(e) {
      const el = e.target;
      if (!el) return false;
      const tag = (el.tagName || "").toLowerCase();
      return tag === "textarea" || tag === "input" || el.isContentEditable;
    }
    document.addEventListener("keydown", (e) => {
      if (isTyping(e)) {
        if (e.key === "Escape") { app.classList.remove("menu"); closeWhy(); }
        return;
      }
      if (e.key === "ArrowRight") go(1);
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "s") { closeWhy(); deck = shuffle(deck); i = 0; show(); }
      if (e.key === "f") toggleFav();
      if (e.key === "r") toggleReader();
      if (e.key === "Escape") { app.classList.remove("menu"); closeWhy(); }
    });
    document.addEventListener("pointerdown", (e) => {
      if (!e.target.closest(".dock") && !e.target.closest(".sheet") && !e.target.closest(".whysheet")) {
        app.classList.remove("menu");
      }
    });

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

    function wantedCol() {
      const q = new URLSearchParams(location.search).get("c");
      return q || localStorage.getItem(COLKEY) || "taki";
    }
    function drawCols() {
      const box = $("cols");
      if (!box) return;
      box.innerHTML = "";
      catalogs.forEach((c) => {
        const b = document.createElement("button");
        b.type = "button";
        b.innerHTML = c.name + ' <span class="hint">' + c.count + "</span>";
        if (col && c.id === col.id) b.classList.add("on");
        b.onclick = () => switchCol(c.id);
        box.appendChild(b);
      });
    }
    function applyCol(data) {
      closeWhy();
      col = data;
      all = data.articles || [];
      localStorage.setItem(COLKEY, data.id);
      savedOnly = false;
      deck = shuffle(all);
      i = 0;
      shownReader = "";
      if (frame.dataset.url) { frame.src = "about:blank"; frame.dataset.url = ""; }
      drawCols();
      show();
      pullLikes();
    }
    function switchCol(id) {
      const meta = catalogs.find((c) => c.id === id) || catalogs[0];
      if (!meta) return;
      app.classList.remove("menu");
      if (col && col.id === meta.id) return;
      fetch(bust(meta.file), { cache: "no-store" }).then((r) => r.json()).then(applyCol);
    }
    loadFavs();
    fetch(bust("collections.json"), { cache: "no-store" })
      .then((r) => r.json())
      .then((list) => {
        catalogs = list;
        const id = wantedCol();
        const meta = list.find((c) => c.id === id) || list[0];
        return fetch(bust(meta.file), { cache: "no-store" }).then((r) => r.json());
      })
      .then(applyCol)
      .catch(() => {
        fetch("articles.json").then((r) => r.json()).then((data) => {
          applyCol({ id: "taki", name: "Taki", articles: data });
        });
      });
  </script>
</body>
</html>
